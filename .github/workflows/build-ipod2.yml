name: Build LastWave Classipod

on:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check mod files are present
        run: |
          ls -la Classipod.kt apply_mod.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Add Classipod interface and hidden downloads
        run: python3 apply_mod.py Classipod.kt

      - name: Restore signing key
        id: keycache
        uses: actions/cache@v4
        with:
          path: lw-signing.p12
          key: lastwave-ipod-signing-key-v1

      - name: Create signing key (first run only)
        if: steps.keycache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -keystore lw-signing.p12 -storetype PKCS12 \
            -storepass lastwaveipod -keypass lastwaveipod -alias release_key \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=LastWave iPod build"

      - name: Prepare signing settings
        run: |
          echo "SIGNING_KEY=$(base64 -w0 lw-signing.p12)" >> "$GITHUB_ENV"
          echo "RELEASE_STORE_PASSWORD=lastwaveipod" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_ALIAS=release_key" >> "$GITHUB_ENV"
          echo "RELEASE_KEY_PASSWORD=lastwaveipod" >> "$GITHUB_ENV"

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LastWave-Classipod-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          package com.lastwave.app.ui.classipod

