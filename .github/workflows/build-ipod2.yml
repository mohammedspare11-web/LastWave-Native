@HiltViewModel
class ClassipodViewModel @Inject constructor(
    val player: MusicPlayer,
    private val settingsPreferences: SettingsPreferences,
    playlistRepository: PlaylistRepository,
    downloadedTrackDao: DownloadedTrackDao,
) : ViewModel() {
    val settings: StateFlow<MiscSettings> = settingsPreferences.settings
        .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), MiscSettings())

    /** Playback state without the 60 ms position ticker, so lists do not repaint 15x a second. */
    val playerState: StateFlow<MusicPlayerState> = player.state
        .map { it.withoutProgress() }
        .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), player.state.value.withoutProgress())

    val playlists: StateFlow<List<SavedPlaylist>> = playlistRepository.playlists
        .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())

    val downloads: StateFlow<List<DownloadedTrackEntity>> = downloadedTrackDao.getAll()
        .catch { emit(emptyList()) }
        .stateIn(viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())

    fun setIpodMode(enabled: Boolean) {
        viewModelScope.launch { settingsPreferences.setIpodModeEnabled(enabled) }
    }
}

private sealed class Page {
    object Root : Page()
    object NowPlaying : Page()
    object UpNext : Page()
    object Liked : Page()
    object Playlists : Page()
    object Downloads : Page()
    object Settings : Page()
    data class PlaylistTracks(val id: Long, val title: String) : Page()
}

private class IpodRow(
    val title: String,
    val detail: String? = null,
    val chevron: Boolean = true,
    val onSelect: () -> Unit,
)

/**
 * Full-screen iPod interface that sits on top of the normal app when iPod mode
 * is on. "LastWave (normal app)" in Settings lets you peek at the regular
 * screens (search, accounts...) and a small iPod pill brings you back.
 */
@Composable
fun ClassipodOverlay(vm: ClassipodViewModel = hiltViewModel()) {
    val settings by vm.settings.collectAsStateWithLifecycle()
    var peekNormal by rememberSaveable { mutableStateOf(false) }
    if (!settings.ipodModeEnabled) return
    if (peekNormal) {
        Box(Modifier.fillMaxSize()) {
            Box(
                Modifier
                    .align(Alignment.CenterEnd)
                    .padding(end = 4.dp)
                    .clip(RoundedCornerShape(50))
                    .background(Color(0xE61C1C1E))
                    .clickable { peekNormal = false }
                    .padding(horizontal = 12.dp, vertical = 9.dp),
            ) {
                Text("iPod", color = Color.White, fontSize = 12.sp, fontWeight = FontWeight.Bold)
            }
        }
        return
    }
    ClassipodScreen(vm = vm, onPeekNormal = { peekNormal = true })
}

private fun pageTitle(page: Page): String = when (page) {
    Page.Root -> "Music"
    Page.NowPlaying -> "Now Playing"
    Page.UpNext -> "Up Next"
    Page.Liked -> "Liked Songs"
    Page.Playlists -> "Playlists"
    Page.Downloads -> "Downloads"
    Page.Settings -> "Settings"
    is Page.PlaylistTracks -> page.title
}

@Composable
private fun ClassipodScreen(vm: ClassipodViewModel, onPeekNormal: () -> Unit) {
    val player = vm.player
    val state by vm.playerState.collectAsStateWithLifecycle()
    val playlists by vm.playlists.collectAsStateWithLifecycle()
    val downloads by vm.downloads.collectAsStateWithLifecycle()
    val progress by player.progressState.collectAsStateWithLifecycle()
    val haptics = LocalHapticFeedback.current
    val context = LocalContext.current

    val stack = remember { mutableStateListOf<Page>(Page.Root) }
    val selections = remember { mutableStateMapOf<Page, Int>() }
    val page: Page = stack.last()

    fun push(p: Page) { stack.add(p) }
    fun back() { if (stack.size > 1) stack.removeAt(stack.lastIndex) }

    val likedTracks = remember(playlists) {
        val liked = playlists.firstOrNull { it.mode == LIKED_SONGS_MODE && it.title == LIKED_SONGS_TITLE }
            ?: playlists.firstOrNull { it.mode == LIKED_SONGS_MODE }
        liked?.tracks?.map { it.toPlayableTrack() }.orEmpty()
    }
    val playlistList = remember(playlists) { playlists.filter { it.mode != LIKED_SONGS_MODE } }
    val downloadTracks = remember(downloads) { downloads.map { it.toPlayableTrack() } }

    val listTracks: List<PlayableTrack>? = when (page) {
        Page.Liked -> likedTracks
        Page.Downloads -> downloadTracks
        is Page.PlaylistTracks -> playlistList.firstOrNull { it.id == page.id }?.tracks?.map { it.toPlayableTrack() }.orEmpty()
        else -> null
    }
    val trackRows: List<IpodRow>? = remember(listTracks, page) {
        listTracks?.let { tracks ->
            val label = pageTitle(page)
            tracks.mapIndexed { i, t ->
                IpodRow(t.title, t.artist, chevron = false) {
                    player.playQueue(tracks, i, label)
                    push(Page.NowPlaying)
                }
            }
        }
    }

    val rows: List<IpodRow> = when (page) {
        Page.Root -> buildList {
            if (state.current != null) add(IpodRow("Now Playing") { push(Page.NowPlaying) })
            add(IpodRow("Up Next", state.queue.size.takeIf { it > 0 }?.toString()) {
                selections[Page.UpNext] = state.currentIndex.coerceAtLeast(0)
                push(Page.UpNext)
            })
            add(IpodRow("Liked Songs") { push(Page.Liked) })
            add(IpodRow("Playlists") { push(Page.Playlists) })
            add(IpodRow("Downloads") { push(Page.Downloads) })
            add(IpodRow("Settings") { push(Page.Settings) })
        }
        Page.UpNext -> state.queue.mapIndexed { i, t ->
            IpodRow(t.title, t.artist, chevron = false) {
                player.seekToQueueItem(i)
                push(Page.NowPlaying)
            }
        }
        Page.Playlists -> playlistList.map { pl ->
            IpodRow(pl.title, pl.tracks.size.toString()) { push(Page.PlaylistTracks(pl.id, pl.title)) }
        }
        Page.Settings -> listOf(
            IpodRow("Shuffle", if (state.shuffleEnabled) "On" else "Off", chevron = false) { player.toggleShuffle() },
            IpodRow(
                "Repeat",
                when (state.repeatMode) {
                    Player.REPEAT_MODE_ONE -> "One"
                    Player.REPEAT_MODE_ALL -> "All"
                    else -> "Off"
                },
                chevron = false,
            ) { player.cycleRepeatMode() },
            IpodRow("LastWave (normal app)") { onPeekNormal() },
            IpodRow("Turn off iPod mode", chevron = false) { vm.setIpodMode(false) },
        )
        Page.NowPlaying -> emptyList()
        else -> trackRows.orEmpty()
    }

    val sel = (selections[page] ?: 0).coerceIn(0, (rows.size - 1).coerceAtLeast(0))

    // Scrubbing on the Now Playing page (finger around the wheel seeks).
    var scrubMs by remember { mutableStateOf<Long?>(null) }
    val track = state.current
    val durMs = if (progress.durationMs > 0L) progress.durationMs else (track?.durationMs ?: state.durationMs)
    val shownMs = scrubMs ?: progress.positionMs

    BackHandler {
        if (stack.size > 1) back() else (context as? Activity)?.moveTaskToBack(true)
    }

    val bodyBrush = Brush.verticalGradient(listOf(BodyTop, BodyBottom))
    BoxWithConstraints(
        Modifier
            .fillMaxSize()
            .background(bodyBrush)
            .pointerInput(Unit) { detectTapGestures { } }
            .statusBarsPadding()
            .navigationBarsPadding(),
    ) {
        val wide = maxWidth > maxHeight
        val wheelSize = if (wide) {
            minOf(maxHeight - 24.dp, 320.dp)
        } else {
            minOf(maxWidth - 48.dp, minOf(340.dp, maxHeight * 0.42f))
        }

        val lcd: @Composable (Modifier) -> Unit = { mod ->
            Lcd(
                modifier = mod,
                title = pageTitle(page),
                canGoBack = stack.size > 1,
                isPlaying = state.isPlaying,
                onBack = { back() },
            ) {
                if (page == Page.NowPlaying) {
                    if (track == null) {
                        Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                            Text("Nothing playing", color = SoftText, fontSize = 15.sp)
                        }
                    } else {
                        NowPlayingView(
                            track = track,
                            index = state.currentIndex + 1,
                            total = state.queue.size,
                            shuffle = state.shuffleEnabled,
                            posMs = shownMs,
                            durMs = durMs,
                        )
                    }
                } else if (rows.isEmpty()) {
                    Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                        Text("No songs", color = SoftText, fontSize = 15.sp)
                    }
                } else {
                    key(page) {
                        val listState = rememberLazyListState(
                            initialFirstVisibleItemIndex = (sel - 3).coerceAtLeast(0),
                        )
                        LaunchedEffect(sel, rows.size) {
                            val visible = listState.layoutInfo.visibleItemsInfo
                            if (visible.isNotEmpty()) {
                                val first = visible.first().index
                                val last = visible.last().index
                                if (sel < first) {
                                    listState.scrollToItem(sel)
                                } else if (sel >= last) {
                                    listState.scrollToItem((sel - (last - first) + 1).coerceAtLeast(0))
                                }
                            }
                        }
                        LazyColumn(Modifier.fillMaxSize(), state = listState) {
                            items(rows.size) { i ->
                                val row = rows[i]
                                RowView(row, selected = i == sel) {
                                    selections[page] = i
                                    row.onSelect()
                                }
                            }
                        }
                    }
                }
            }
        }

        val wheel: @Composable () -> Unit = {
            ClickWheel(
                size = wheelSize,
                isPlaying = state.isPlaying,
                onMenu = { back() },
                onNext = { player.next() },
                onPrevious = { player.previous() },
                onPlayPause = { player.togglePlayPause() },
                onCenter = {
                    if (page == Page.NowPlaying) player.togglePlayPause() else rows.getOrNull(sel)?.onSelect?.invoke()
                },
                onCenterHold = { player.toggleShuffle() },
                onTick = { dir ->
                    if (page != Page.NowPlaying && rows.isNotEmpty()) {
                        val n = (sel + dir).coerceIn(0, rows.size - 1)
                        if (n != sel) {
                            selections[page] = n
                            haptics.performHapticFeedback(HapticFeedbackType.TextHandleMove)
                        }
                    }
                },
                onDragStart = { if (page == Page.NowPlaying) scrubMs = progress.positionMs },
                onDelta = { rad ->
                    val cur = scrubMs
                    if (page == Page.NowPlaying && cur != null) {
                        val upper = if (durMs > 0L) durMs else Long.MAX_VALUE
                        scrubMs = (cur + (rad / (2f * PI.toFloat()) * 60_000f).toLong()).coerceIn(0L, upper)
                    }
                },
                onDragEnd = {
                    scrubMs?.let { player.seekTo(it) }
                    scrubMs = null
                },
            )
        }

        if (wide) {
            Row(
                Modifier.fillMaxSize().padding(16.dp),
                horizontalArrangement = Arrangement.spacedBy(20.dp),
                verticalAlignment = Alignment.CenterVertically,
            ) {
                lcd(Modifier.weight(1f).fillMaxHeight())
                wheel()
            }
        } else {
            Column(
                Modifier.fillMaxSize().padding(horizontal = 16.dp, vertical = 12.dp),
                horizontalAlignment = Alignment.CenterHorizontally,
            ) {
                lcd(Modifier.fillMaxWidth().weight(1f))
                Spacer(Modifier.height(18.dp))
                wheel()
            }
        }
    }
}

@Composable
private fun Lcd(
    modifier: Modifier,
    title: String,
    canGoBack: Boolean,
    isPlaying: Boolean,
    onBack: () -> Unit,
    content: @Composable () -> Unit,
) {
    Box(
        modifier
            .clip(RoundedCornerShape(14.dp))
            .background(LcdBezel)
            .padding(5.dp),
    ) {
        Column(
            Modifier
                .fillMaxSize()
                .clip(RoundedCornerShape(9.dp))
                .background(LcdBg),
        ) {
            Row(
                Modifier
                    .fillMaxWidth()
                    .height(34.dp)
                    .background(Brush.verticalGradient(listOf(HeaderTop, HeaderBottom)))
                    .padding(horizontal = 10.dp),
                verticalAlignment = Alignment.CenterVertically,
            ) {
                Box(Modifier.width(28.dp).clickable(enabled = canGoBack) { onBack() }) {
                    if (canGoBack) Text("\u2039", color = Color.White, fontSize = 24.sp)
                }
                Text(
                    title,
                    modifier = Modifier.weight(1f),
                    textAlign = TextAlign.Center,
                    color = Color.White,
                    fontWeight = FontWeight.Bold,
                    fontSize = 15.sp,
                    maxLines = 1,
                    overflow = TextOverflow.Ellipsis,
                )
                Box(Modifier.width(28.dp), contentAlignment = Alignment.CenterEnd) {
                    Icon(
                        imageVector = if (isPlaying) Icons.Filled.PlayArrow else Icons.Filled.Pause,
                        contentDescription = null,
                        tint = Color.White,
                        modifier = Modifier.size(16.dp),
                    )
                }
            }
            Box(Modifier.fillMaxWidth().height(1.dp).background(Color.Black))
            Box(Modifier.fillMaxSize()) { content() }
        }
    }
}

@Composable
private fun RowView(row: IpodRow, selected:import sys, pathlib
ROOT = pathlib.Path("app/src/main/java/com/lastwave/app")

def edit(rel, old, new):
    p = ROOT / rel
    raw = p.read_bytes().decode("utf-8")
    crlf = "\r\n" in raw
    text = raw.replace("\r\n", "\n")
    n = text.count(old)
    if n != 1:
        sys.exit(f"ERROR: expected exactly 1 match in {rel}, found {n} for:\n{old[:120]}")
    text = text.replace(old, new)
    if crlf:
        text = text.replace("\n", "\r\n")
    p.write_bytes(text.encode("utf-8"))
    print("patched", rel)

